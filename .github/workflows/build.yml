name: Build APK

on:
  push:
    branches: [ "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Set git init default branch to master
        run: git config --global init.defaultBranch master

      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      # --- Install NDK only if not already pre-installed on runner ---
      - name: Install NDK (skip if present)
        run: |
          NDK_DIR="$ANDROID_HOME/ndk/27.0.12077973"
          if [ -d "$NDK_DIR" ]; then
            echo "NDK 27.0.12077973 already present, skipping install"
          else
            echo "NDK not found, installing..."
            sdkmanager "ndk;27.0.12077973" --sdk_root=$ANDROID_HOME
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Restore signing keystore
        run: |
          if [ -n "${{ secrets.RELEASE_KEYSTORE_B64 }}" ]; then
            mkdir -p "$RUNNER_TEMP/ks"
            echo "${{ secrets.RELEASE_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/ks/kiloproxy-release.jks"
          fi

      # --- Build: arm64-v8a only on push to master; all ABIs on tags ---
      - name: Build Release APK
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "Tag push — building all ABIs"
            gradle assembleRelease --warning-mode all
          else
            echo "Branch push — building arm64-v8a only"
            gradle assembleRelease -Pabi=arm64-v8a --warning-mode all
          fi
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973
          KILO_KEYSTORE_FILE: ${{ runner.temp }}/ks/kiloproxy-release.jks
          KILO_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KILO_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KILO_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: app-release
          path: app/build/outputs/apk/release/*.apk
