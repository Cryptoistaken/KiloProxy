<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ProxyCard v2 - proper mock</title>
<style>
  :root {
    --page: #121218;
    --text: #f2f2f5;
    --text2: #9a9aa5;
    --card: #1c1c22;
    --border: #2c2c34;
    --green: #1fd47e;
    --green-text: #1fd47e;
    --red: #f2555a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--page); color: var(--text);
    padding: 24px 16px 60px; max-width: 560px; margin: 0 auto;
    -webkit-font-smoothing: antialiased;
  }
  .page-bar { display: flex; align-items: center; justify-content: space-between; margin: 20px 0 12px; }
  .page-bar h2 { font-size: 24px; font-weight: 700; letter-spacing: -0.25px; }

  /* ---------- card row ----------
     Hierarchy: icon = country flag only | line1 name + status | line2 country + provider | line3 host */
  .card {
    display: flex; align-items: center; gap: 12px;
    background: var(--card); border: 1px solid var(--border);
    border-radius: 16px; padding: 12px 14px; margin-bottom: 10px;
    cursor: pointer;
  }
  .icon-wrap { flex: 0 0 auto; width: 38px; align-self: center; }
  .flag-big {
    display: block; width: 38px; height: 28px;
    border-radius: 7px; overflow: hidden;
  }
  .flag-big svg { display: block; width: 100%; height: 100%; }
  .tile-neutral {
    width: 38px; height: 28px;
    display: flex; align-items: center; justify-content: center;
  }
  .tile-neutral svg { width: 26px; height: 26px; fill: var(--text2); }
  .mid { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; }
  .name-row { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .host-line {
    font-size: 12px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    color: var(--text2); margin-top: 2px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .name {
    font-size: 14px; font-weight: 600; line-height: 1.25;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  /* App signal_dot: plain 10px oval #22C55E, hidden when offline */
  .dot { width: 10px; height: 10px; border-radius: 50%; flex: 0 0 auto; background: #22C55E; }
  .dot.off { display: none; }
  .sub2 {
    font-size: 12px; color: var(--text2); margin-top: 2px; line-height: 1.35;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .right {
    display: flex; flex-direction: column; align-items: flex-end;
    justify-content: center; align-self: stretch; flex: 0 0 auto;
    padding: 2px 0;
  }
  .used { font-size: 14px; font-weight: 700; white-space: nowrap; }
  .used-cap { font-size: 10px; color: var(--text2); }

  /* ---------- bottom sheet ---------- */
  .scrim {
    display: none; position: fixed; inset: 0; z-index: 10;
    background: rgba(0, 0, 0, 0.55);
    align-items: flex-end; justify-content: center;
  }
  .scrim.open { display: flex; }
  .sheet {
    width: 100%; max-width: 560px; background: var(--card);
    border-radius: 24px 24px 0 0; padding: 10px 18px 24px;
    animation: rise 0.22s ease-out;
  }
  @keyframes rise { from { transform: translateY(40px); opacity: 0.6; } to { transform: none; opacity: 1; } }
  .grab { width: 72px; height: 5px; border-radius: 3px; background: var(--text2); opacity: 0.5; margin: 0 auto 12px; }
  .sheet-head { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
  .used-wrap { display: flex; flex-direction: column; align-items: flex-end; }
  .sheet-head .name { font-size: 16px; }
  .facts { display: flex; gap: 12px; margin-bottom: 12px; }
  .facts .cell { flex: 1; min-width: 0; }
  .k { font-size: 12px; color: var(--text2); margin-bottom: 2px; }
  .v { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .v.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
  .v.green { color: var(--green-text); font-weight: 700; }
  hr { border: 0; border-top: 1px solid var(--border); margin-bottom: 12px; }
  .menu-row {
    display: flex; align-items: center; gap: 14px; width: 100%;
    background: none; border: 0; color: var(--text);
    font-size: 15px; padding: 10px 4px; cursor: pointer; text-align: left;
  }
  .menu-row svg { width: 22px; height: 22px; flex: 0 0 auto; }
  .menu-row.danger { color: var(--red); }
  .menu-row:disabled { opacity: 0.55; cursor: default; }
  .close-row { display: flex; justify-content: center; margin-top: 8px; }
  .close-row button {
    font-size: 14px; color: var(--text2); background: none;
    border: 1px solid var(--border); border-radius: 10px;
    padding: 8px 26px; cursor: pointer;
  }
  .toast {
    display: none; position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%);
    background: var(--text); color: var(--page); font-size: 13px; font-weight: 600;
    padding: 10px 18px; border-radius: 9999px; z-index: 20; white-space: nowrap;
  }
  .toast.show { display: block; }

  /* ---------- edit sheet (mirrors AddEditProxySheet) ---------- */
  .etitle { font-size: 16px; font-weight: 700; margin-top: 10px; }
  .estep { font-size: 12px; color: var(--text2); margin-bottom: 10px; }
  .efield { margin-bottom: 8px; min-width: 0; }
  .efield label { display: block; font-size: 12px; font-weight: 600; color: var(--text2); margin-bottom: 4px; }
  .efield input, .efield select {
    width: 100%; font-size: 14px; color: var(--text); font-family: inherit;
    background: var(--page); border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 12px; outline: none;
  }
  .erow { display: flex; gap: 8px; }
  .erow .grow3 { flex: 3; } .erow .grow1 { flex: 1; }
  .pw-wrap { position: relative; }
  .pw-wrap button {
    position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
    background: none; border: 0; color: var(--text2); font-size: 13px; cursor: pointer;
  }
  .estatus { font-size: 13px; font-weight: 600; color: var(--text2); margin-top: 8px; }
  .estatus.ok { color: var(--green-text); }
  .eactions { display: flex; gap: 8px; margin-top: 16px; }
  .ebtn {
    flex: 1; font-size: 13px; padding: 10px 0; border-radius: 8px;
    border: 1px solid var(--border); background: none; color: var(--text); cursor: pointer;
  }
  .ebtn.primary { background: var(--green); border: 0; color: #06130c; font-weight: 700; }
  .ebtn:disabled { opacity: 0.45; cursor: default; }
  .echips { display: flex; gap: 6px; }
  .echip {
    flex: 1; font-size: 12px; padding: 8px 0; border-radius: 8px;
    border: 1px solid var(--border); background: none; color: var(--text2); cursor: pointer;
  }
  .echip.on { border-color: var(--green); color: var(--green-text); font-weight: 700; }

  /* ---------- search + FAB (mirrors ProxiesScreen) ---------- */
  .search {
    display: flex; align-items: center; gap: 8px;
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 10px 12px; margin-bottom: 12px;
  }
  .search svg { width: 18px; height: 18px; fill: var(--text2); flex: 0 0 auto; }
  .search input {
    flex: 1; min-width: 0; background: none; border: 0; outline: none;
    font-size: 14px; color: var(--text); font-family: inherit;
  }
  .search input::placeholder { color: var(--text2); }
  .fab {
    position: fixed; right: 20px; bottom: 24px; width: 56px; height: 56px;
    border-radius: 50%; border: 0; cursor: pointer;
    background: var(--green); color: #06130c; font-size: 28px; line-height: 1;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4); z-index: 5;
  }
</style>
</head>
<body>

  <div class="page-bar">
    <h2>Profiles</h2>

  <div class="search">

    <div class="icon-wrap">
      <div class="tile-neutral">
        <svg viewBox="0 0 24 24" fill="currentColor"><title>customize</title><path d="M10 3H4a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V4a1 1 0 0 0-1-1m10 0h-6a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V4a1 1 0 0 0-1-1M10 13H4a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1v-6a1 1 0 0 0-1-1m8 1h-2v2h-2v2h2v2h2v-2h2v-2h-2z"/></svg>
      </div>
    </div>
    <div class="mid">
      <div class="name-row">
        <span class="name">My Custom Proxy</span>
        <span class="dot off"></span>
      </div>
      <div class="host-line">192.168.100.250</div>
    </div>
    <div class="right">
      <div class="used-wrap">
        <div class="used">0 B</div>
        <div class="used-cap">Used</div>
      </div>

  <!-- Bottom sheet -->
  <div class="scrim" id="scrim">
    <div class="sheet" role="dialog" aria-label="Profile details">
      <div class="grab"></div>
      <div class="sheet-head">
        <div class="icon-wrap">
          <span class="flag-big" id="sheetFlag">
            <svg viewBox="0 0 44 32">
              <rect width="44" height="32" fill="#ffffff"/>
              <g fill="#b22234">
                <rect y="0" width="44" height="2.46"/><rect y="4.92" width="44" height="2.46"/>
                <rect y="9.85" width="44" height="2.46"/><rect y="14.77" width="44" height="2.46"/>
                <rect y="19.69" width="44" height="2.46"/><rect y="24.62" width="44" height="2.46"/>
                <rect y="29.54" width="44" height="2.46"/>
              </g>
              <rect width="19" height="17.23" fill="#3c3b6e"/>
              <g fill="#ffffff">
                <circle cx="3.2" cy="3.1" r="1"/><circle cx="7.3" cy="3.1" r="1"/><circle cx="11.4" cy="3.1" r="1"/><circle cx="15.5" cy="3.1" r="1"/>
                <circle cx="5.2" cy="6" r="1"/><circle cx="9.3" cy="6" r="1"/><circle cx="13.4" cy="6" r="1"/>
                <circle cx="3.2" cy="8.9" r="1"/><circle cx="7.3" cy="8.9" r="1"/><circle cx="11.4" cy="8.9" r="1"/><circle cx="15.5" cy="8.9" r="1"/>
                <circle cx="5.2" cy="11.8" r="1"/><circle cx="9.3" cy="11.8" r="1"/><circle cx="13.4" cy="11.8" r="1"/>
                <circle cx="3.2" cy="14.7" r="1"/><circle cx="7.3" cy="14.7" r="1"/><circle cx="11.4" cy="14.7" r="1"/><circle cx="15.5" cy="14.7" r="1"/>
              </g>
            </svg>
          </span>
          <div class="tile-neutral" id="sheetNeutral" style="display:none">
            <svg viewBox="0 0 24 24" fill="currentColor"><title>customize</title><path d="M10 3H4a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V4a1 1 0 0 0-1-1m10 0h-6a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V4a1 1 0 0 0-1-1M10 13H4a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1v-6a1 1 0 0 0-1-1m8 1h-2v2h-2v2h2v2h2v-2h2v-2h-2z"/></svg>
          </div>
        </div>
        <div class="mid">
          <div class="name" id="sheetName">Profile 1</div>
          <div class="sub2" id="sheetSub">United States</div>
        </div>

      <div class="facts">
        <div class="cell"><div class="k">Provider</div><div class="v" id="sheetProvider">OwlProxy</div></div>

        <div class="cell"><div class="k">Server</div><div class="v mono" id="sheetServer">change4.owlproxy.com</div></div>
      </div>
      <hr>
      <button class="menu-row" id="testBtn">
        <svg viewBox="0 0 20 20" fill="currentColor"><title>network</title><path d="M2.32 9.91a9.5 9.5 0 0 1 15.36 0l1.43-1.43a11.5 11.5 0 0 0-18.22 0zm3.63 3.62a4.5 4.5 0 0 1 8.1 0l1.45-1.48a6.5 6.5 0 0 0-11.02 0z"/><circle cx="10" cy="15.5" r="1.5"/></svg>
        <span>Test</span>

      <button class="menu-row" id="editBtn">
        <svg viewBox="0 0 24 24" fill="currentColor"><title>pencil</title><path d="M20.71 7.04c.39-.39.39-1.04 0-1.41l-2.34-2.34c-.37-.39-1.02-.39-1.41 0l-1.84 1.83l3.75 3.75M3 17.25V21h3.75L17.81 9.93l-3.75-3.75z"/></svg>
        <span>Edit</span>
      </button>
      <button class="menu-row" id="dupBtn">
        <svg viewBox="0 0 20 20" fill="currentColor"><title>duplicate</title><path d="M9 2a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2V6.414A2 2 0 0 0 16.414 5L14 2.586A2 2 0 0 0 12.586 2z"/><path d="M3 8a2 2 0 0 1 2-2v10h8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
        <span>Duplicate</span>
      </button>
      <button class="menu-row danger" id="delBtn">
        <svg viewBox="0 0 24 24" fill="currentColor"><title>delete</title><path d="M7 21q-.825 0-1.412-.587T5 19V6H4V4h5V3h6v1h5v2h-1v13q0 .825-.587 1.413T17 21zm2-4h2V8H9zm4 0h2V8h-2z"/></svg>

      <div class="close-row"><button onclick="closeSheet()">Close</button></div>

  <!-- Edit sheet: Step 1 Connection / Step 2 Name and IP Mode -->
  <div class="scrim" id="editScrim">
    <div class="sheet" role="dialog" aria-label="Edit proxy">
      <div class="grab"></div>
      <div class="etitle" id="editTitle">Edit Proxy</div>
      <div class="estep" id="editStep">Step 1 of 2 - Connection</div>
      <div id="epage0">
        <div class="erow" style="margin-bottom:8px">
          <button class="ebtn" style="flex:1" onclick="toast('Copied to clipboard')">Copy</button>
          <button class="ebtn" style="flex:1" onclick="toast('Pasted from clipboard')">Paste</button>
        </div>
        <div class="erow">
          <div class="efield grow3"><label>Host</label><input id="eHost" placeholder="proxy.example.com" autocomplete="off"></div>
          <div class="efield grow1"><label>Port</label><input id="ePort" placeholder="1080" inputmode="numeric" autocomplete="off"></div>
        </div>
        <div class="efield"><label>Username</label><input id="eUser" placeholder="user" autocomplete="off"></div>
        <div class="efield"><label>Password</label>
          <div class="pw-wrap"><input id="ePass" type="password" placeholder="pass"><button type="button" id="eEye">Show</button></div>
        </div>
        <div class="efield"><label>Country</label>
          <select id="eCountry">
            <option value="">None</option>
            <option value="US">United States</option>

        </div>
      </div>

        <div class="efield"><label>Profile Name</label><input id="eName" placeholder="e.g. My Proxy" autocomplete="off"></div>

            <option value="unique">Unique</option>
            <option value="sticky">Sticky</option>
          </select>
        </div>

          <div class="echips" id="eChips">
            <button class="echip on">5</button><button class="echip">10</button><button class="echip">15</button><button class="echip">30</button><button class="echip">60</button><button class="echip">90</button>
          </div>
        </div>

      <div class="estatus" id="eStatus">Fill all required fields to test</div>
      <div class="eactions" id="eAct0">
        <button class="ebtn" onclick="closeEdit()">Cancel</button>
        <button class="ebtn" id="eTest0">Test</button>
        <button class="ebtn primary" id="eNext" disabled>Next</button>
      </div>
      <div class="eactions" id="eAct1" style="display:none">
        <button class="ebtn" id="eBack">Back</button>
        <button class="ebtn" id="eTest1">Test</button>
        <button class="ebtn primary" id="eSave" disabled>Save</button>
      </div>
    </div>
  </div>
  <div class="toast" id="toast"></div>

<script>
  var DATA = {
    owl: { flag: true, name: 'Profile 1', sub: 'United States',
           provider: 'OwlProxy', used: '1.2 GB', server: 'change4.owlproxy.com',
           host: 'change4.owlproxy.com', port: '7778',
           user: 'base_custom_zone_US', pass: 'secret1', cc: 'US' },
    custom: { flag: false, name: 'My Custom Proxy', sub: 'Custom proxy',
              provider: 'Custom', used: '0 B', server: '192.168.100.250',
              host: '192.168.100.250', port: '1080',
              user: 'user', pass: 'pass', cc: '' }
  };
  var scrim = document.getElementById('scrim');
  var currentKey = null, currentCard = null, copyN = 0;
  function openSheet(key, el) {
    var d = DATA[key];
    currentKey = key;
    currentCard = el || currentCard;
    document.getElementById('sheetFlag').style.display = d.flag ? 'block' : 'none';
    document.getElementById('sheetNeutral').style.display = d.flag ? 'none' : 'flex';
    document.getElementById('sheetName').textContent = d.name;
    document.getElementById('sheetSub').textContent = d.sub;
    document.getElementById('sheetProvider').textContent = d.provider;
    document.getElementById('sheetUsed').textContent = d.used;
    document.getElementById('sheetServer').textContent = d.server;
    var t = document.querySelector('#testBtn span');
    t.textContent = 'Test';
    document.getElementById('testBtn').disabled = false;
    scrim.classList.add('open');
  }
  function closeSheet() { scrim.classList.remove('open'); }
  scrim.addEventListener('click', function (e) { if (e.target === scrim) closeSheet(); });
  document.getElementById('testBtn').addEventListener('click', function () {
    var b = this, label = b.querySelector('span');
    b.disabled = true; label.textContent = 'Testing';
    setTimeout(function () { b.disabled = false; label.textContent = 'Test'; }, 1500);
  });
  var toastTimer = null;
  function toast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove('show'); }, 1800);
  }
  document.getElementById('editBtn').addEventListener('click', function () {
    openEdit();
  });
  document.getElementById('dupBtn').addEventListener('click', function () {
    var src = DATA[currentKey];
    copyN += 1;
    var key = 'copy' + copyN;
    DATA[key] = { flag: src.flag, name: src.name + ' (copy)', sub: src.sub,
                  provider: src.provider, used: '0 B', server: src.server,
                  host: src.host, port: src.port, user: src.user, pass: src.pass, cc: src.cc };
    var clone = currentCard.cloneNode(true);
    clone.querySelector('.name').textContent = DATA[key].name;
    clone.querySelector('.dot').classList.add('off');
    clone.querySelector('.used').textContent = '0 B';
    clone.setAttribute('onclick', "openSheet('" + key + "', this)");
    currentCard.parentNode.insertBefore(clone, currentCard.nextSibling);
    closeSheet();
    toast('Duplicated as "' + DATA[key].name + '"');
  });
  document.getElementById('delBtn').addEventListener('click', function () {
    if (confirm('Delete profile "' + DATA[currentKey].name + '"? This cannot be undone.')) {
      currentCard.remove();
      closeSheet();
    }
  });

  /* ---------- search ---------- */
  document.getElementById('q').addEventListener('input', function () {
    var q = this.value.trim().toLowerCase();
    document.querySelectorAll('.card').forEach(function (c) {
      var name = c.querySelector('.name').textContent.toLowerCase();
      c.style.display = (q === '' || name.indexOf(q) !== -1) ? '' : 'none';
    });
  });

  /* ---------- edit sheet ---------- */
  var editScrim = document.getElementById('editScrim');
  var editKey = null, editIsAdd = false, testPassed = false;
  var eHost = document.getElementById('eHost'), ePort = document.getElementById('ePort'),
      eUser = document.getElementById('eUser'), ePass = document.getElementById('ePass'),
      eName = document.getElementById('eName'), eCountry = document.getElementById('eCountry'),
      eMode = document.getElementById('eMode'), eStatus = document.getElementById('eStatus'),
      eNext = document.getElementById('eNext'), eSave = document.getElementById('eSave');
  function ePage(n) {
    document.getElementById('epage0').style.display = n === 0 ? '' : 'none';
    document.getElementById('epage1').style.display = n === 1 ? '' : 'none';
    document.getElementById('eAct0').style.display = n === 0 ? '' : 'none';
    document.getElementById('eAct1').style.display = n === 1 ? '' : 'none';
    document.getElementById('editStep').textContent =
      n === 0 ? 'Step 1 of 2 - Connection' : 'Step 2 of 2 - Name and IP Mode';
  }
  function eValidate() {
    var ok = eHost.value.trim() !== '' && /^[0-9]{1,5}$/.test(ePort.value.trim()) &&
             eUser.value !== '' && ePass.value !== '' && eName.value.trim() !== '';
    var conn = eHost.value.trim() !== '' && /^[0-9]{1,5}$/.test(ePort.value.trim()) &&
               eUser.value !== '' && ePass.value !== '';
    eNext.disabled = !conn;
    eSave.disabled = !(ok && testPassed);
    if (!ok || !testPassed) {
      eStatus.classList.remove('ok');
      eStatus.textContent = 'Fill all required fields to test';
    }
  }
  function eFill(d) {
    eHost.value = d.host; ePort.value = d.port;
    eUser.value = d.user; ePass.value = d.pass;
    eName.value = d.name; eCountry.value = d.cc || '';
    eMode.value = 'unique';
    document.getElementById('eTimeWrap').style.display = 'none';
  }
  function openEdit() {
    editIsAdd = false; editKey = currentKey; testPassed = false;
    document.getElementById('editTitle').textContent = 'Edit Proxy';
    eFill(DATA[editKey]);
    ePage(0); eValidate(); closeSheet();
    editScrim.classList.add('open');
  }
  function openAdd() {
    editIsAdd = true; testPassed = false;
    editKey = 'new' + Date.now();
    document.getElementById('editTitle').textContent = 'Add Proxy';
    eFill({ host: '', port: '1080', user: '', pass: '',
            name: 'Profile ' + (document.querySelectorAll('.card').length + 1), cc: '' });
    ePage(0); eValidate();
    editScrim.classList.add('open');
  }
  function closeEdit() { editScrim.classList.remove('open'); }
  editScrim.addEventListener('click', function (e) { if (e.target === editScrim) closeEdit(); });
  [eHost, ePort, eUser, ePass, eName].forEach(function (el) {
    el.addEventListener('input', function () { testPassed = false; eValidate(); });
  });
  function eRunTest(btn) {
    if (btn.disabled) return;
    btn.disabled = true;
    var orig = btn.textContent;
    btn.textContent = 'Testing';
    setTimeout(function () {
      btn.disabled = false; btn.textContent = orig;
      testPassed = true;
      eStatus.classList.add('ok');
      eStatus.textContent = 'Proxy is valid, ready to save';
      eValidate();
    }, 1200);
  }
  document.getElementById('eTest0').addEventListener('click', function () { eRunTest(this); });
  document.getElementById('eTest1').addEventListener('click', function () { eRunTest(this); });
  eNext.addEventListener('click', function () { if (!eNext.disabled) ePage(1); });
  document.getElementById('eBack').addEventListener('click', function () { ePage(0); });
  document.getElementById('eEye').addEventListener('click', function () {
    var show = ePass.type === 'password';
    ePass.type = show ? 'text' : 'password';
    this.textContent = show ? 'Hide' : 'Show';
  });
  eMode.addEventListener('change', function () {
    document.getElementById('eTimeWrap').style.display = eMode.value === 'sticky' ? '' : 'none';
  });
  document.querySelectorAll('#eChips .echip').forEach(function (c) {
    c.addEventListener('click', function () {
      document.querySelectorAll('#eChips .echip').forEach(function (x) { x.classList.remove('on'); });
      c.classList.add('on');
    });
  });
  eSave.addEventListener('click', function () {
    if (eSave.disabled) return;
    var cc = eCountry.value;
    var ccName = eCountry.options[eCountry.selectedIndex].text;
    if (editIsAdd) {
      var key = 'added' + Date.now();
      var isUS = cc === 'US';
      DATA[key] = { flag: isUS, name: eName.value.trim(), sub: cc ? ccName : 'Custom proxy',
                    provider: cc ? (isUS ? 'OwlProxy' : 'Custom') : 'Custom', used: '0 B',
                    host: eHost.value.trim(), server: eHost.value.trim(),
                    port: ePort.value.trim(), user: eUser.value, pass: ePass.value, cc: cc };
      var tpl = document.querySelector(isUS ? '.card .flag-big' : '.card .tile-neutral').closest('.card').cloneNode(true);
      tpl.querySelector('.name').textContent = DATA[key].name;
      tpl.querySelector('.host-line').textContent = DATA[key].host;
      tpl.querySelector('.used').textContent = '0 B';
      tpl.querySelector('.dot').classList.add('off');
      tpl.style.display = '';
      tpl.setAttribute('onclick', "openSheet('" + key + "', this)");
      var search = document.querySelector('.search');
      search.parentNode.insertBefore(tpl, search.nextSibling);
    } else {
      var d = DATA[editKey];
      d.host = eHost.value.trim(); d.server = d.host;
      d.port = ePort.value.trim(); d.user = eUser.value; d.pass = ePass.value;
      d.name = eName.value.trim(); d.cc = cc;
      currentCard.querySelector('.name').textContent = d.name;
      currentCard.querySelector('.host-line').textContent = d.host;
    }
    closeEdit();
    toast('Saved');
  });
</script>
</body>
</html>
