<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KiloProxy — Floating Bubble Long-Press Menu Demo</title>
<style>
  :root {
    --bg: #E8EAED;
    --surface: #FFFFFF;
    --surface-2: #F4F4F5;
    --outline: #E4E4E7;
    --text: #18181B;
    --text-dim: #71717A;
    --red: #EF4444;
    --green: #22C55E;
    --accent: #6D4AFF;   /* Proton-like purple */
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    width: 100%; height: 100%;
    overflow: hidden;
  }
  body { position: relative; }

  .hintbar {
    position: fixed; top: 18px; left: 50%;
    transform: translateX(-50%);
    z-index: 5;
    color: rgba(0,0,0,.55);
    font-size: 12px;
    display: flex; gap: 18px;
    white-space: nowrap;
    pointer-events: none;
  }
  .hintbar b { color: rgba(0,0,0,.8); font-weight: 600; }

  /* ---------- Bubble (matches FloatingControlService) ---------- */
  .bubble {
    position: fixed;
    width: 60px; height: 60px;
    left: 16px; top: 120px;
    border-radius: 50%;
    background: #000000;
    display: flex; align-items: center; justify-content: center;
    cursor: grab;
    z-index: 30;
    transition: transform .12s ease, background .25s ease;
    touch-action: none;
  }
  .bubble.connected { background: #EF4444; }
  .bubble.connecting { animation: breathe 0.65s ease-in-out infinite alternate; }
  .bubble.pressed { transform: scale(.92); }
  .bubble.dragging { cursor: grabbing; }
  @keyframes breathe { from { transform: scale(1); } to { transform: scale(1.07); } }

  .glyph { width: 26px; height: 26px; color: #fff; }
  .timer {
    position: absolute; color: #fff; font-weight: 700; font-size: 11.5px;
    font-variant-numeric: tabular-nums; letter-spacing: .3px;
  }
  .connecting-spinner {
    position: absolute; width: 26px; height: 26px; border-radius: 50%;
    border: 3px solid rgba(255,255,255,.25); border-top-color: #fff;
    animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* flag pill under the bubble */
  .flagpill {
    position: fixed;
    transform: translateX(-50%);
    background: #fff; color: #000;
    border-radius: 10px;
    padding: 3px 9px;
    font-size: 10px; font-weight: 700; letter-spacing: .3px;
    white-space: nowrap;
    box-shadow: 0 4px 10px rgba(0,0,0,.35);
    z-index: 29;
    transition: opacity .2s ease;
    opacity: 0;
  }
  .flagpill.show { opacity: 1; }

  /* ---------- Long-press menu (Proton-inspired, white) ---------- */
  .scrim {
    position: fixed; inset: 0; z-index: 40;
    background: rgba(0,0,0,.35);
    opacity: 0; pointer-events: none;
    transition: opacity .18s ease;
  }
  .scrim.show { opacity: 1; pointer-events: auto; }

  .menu {
    position: fixed;
    width: 230px;
    background: var(--surface);
    border: 1px solid var(--outline);
    border-radius: 12px;
    box-shadow: 0 14px 40px rgba(0,0,0,.45);
    z-index: 41;
    padding: 6px 2px 6px 2px;
    opacity: 0;
    transform: scale(.55);
    transition: opacity .14s ease, transform .2s cubic-bezier(.2,.9,.25,1.25);
    pointer-events: none;
    display: flex;
    flex-direction: row;
  }
  .menu.show { opacity: 1; transform: scale(1); pointer-events: auto; }

  /* left icon rail */
  .menu .rail {
    display: flex; flex-direction: column; align-items: center;
    gap: 3px; flex: none;
    padding: 0 1px 0 0;
    border-right: 1px solid var(--outline);
    margin-right: 2px;
  }
  .menu .rail .page {
    width: 28px; height: 28px; border-radius: 7px;
    border: none; background: transparent;
    display: flex; align-items: center; justify-content: center;
    color: #000;
    cursor: pointer;
    padding: 0;
    transition: background .12s ease, color .12s ease;
  }
  .menu .rail .page:hover { background: var(--surface-2); }
  .menu .rail .page.active { color: #000; background: var(--surface-2); }
  .menu .rail .page svg { width: 17px; height: 17px; }

  .menu .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }

/* search bar — always visible at the top of the menu */
  .menu .search {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 4px 6px;
    border-bottom: 1px solid var(--outline);
    margin-bottom: 4px;
  }
  .menu .search input {
    flex: 1; min-width: 0;
    border: 1px solid var(--outline);
    background: var(--surface-2);
    border-radius: 7px;
    padding: 5px 8px;
    font-size: 11px;
    font-family: inherit;
    color: var(--text);
    outline: none;
  }
  .menu .search input:focus { border-color: var(--accent); }
  .menu .search input::placeholder { color: var(--text-dim); }
  .menu .search .clear {
    border: none; background: transparent;
    color: var(--text-dim);
    font-size: 14px; cursor: pointer; padding: 2px 4px;
  }
/* profile list panel */
  .menu .profiles {
    display: none;
    overflow-y: auto;
    max-height: 200px;
    padding: 0 2px 2px;
    flex-direction: column;
  }
  .menu .profiles.show { display: flex; }
  .menu .profiles::-webkit-scrollbar { width: 3px; }
  .menu .profiles::-webkit-scrollbar-thumb { background: #C4C4C8; border-radius: 2px; }
  .menu .profiles::-webkit-scrollbar-track { background: transparent; }

  .profile-row {
    display: flex; align-items: center; gap: 8px;
    min-height: 32px;
    padding: 2px 8px;
    border-radius: 8px;
    cursor: pointer;
    transition: background .12s ease;
  }
  .profile-row:hover { background: var(--surface-2); }
  .profile-row:active { background: #E9E4FF; }
  .profile-row.selected { background: #F0ECFF; }
  .profile-row .picon {
    width: 20px; text-align: center; flex: none;
    font-size: 13px;
  }
  .profile-row .pnames { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 5px; overflow: hidden; }
  .profile-row .pnames .full { font-size: 11px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .profile-row .pnames .sub { font-size: 10px; color: var(--text-dim); font-weight: 600; flex: none; }
  .profile-row .check {
    width: 12px; height: 12px; flex: none;
    border-radius: 50%;
    border: 2px solid var(--outline);
    display: flex; align-items: center; justify-content: center;
  }
  .profile-row.selected .check { border-color: var(--green); }
  .profile-row.selected .check::after {
    content: ""; width: 6px; height: 6px; border-radius: 50%;
    background: var(--green);
  }

/* country list */
  .menu .list {
    overflow-y: auto;
    max-height: 200px;
    padding: 0 2px 2px;
  }
  .menu .list::-webkit-scrollbar { width: 3px; }
  .menu .list::-webkit-scrollbar-thumb { background: #C4C4C8; border-radius: 2px; }
  .menu .list::-webkit-scrollbar-track { background: transparent; }

  .menu .seclabel {
    font-size: 9px; font-weight: 700; letter-spacing: .6px;
    color: #000; text-transform: uppercase;
    padding: 5px 8px 2px;
  }
  .menu .sep {
    height: 1px; background: var(--outline);
    margin: 2px 6px;
  }

  .country-row {
    display: flex; align-items: center; gap: 8px;
    min-height: 32px;
    padding: 2px 8px;
    border-radius: 8px;
    cursor: pointer;
    transition: background .12s ease;
    position: relative;
  }
  .country-row:hover { background: var(--surface-2); }
  .country-row:active { background: #E9E4FF; }
  /* chosen country — subtle color shift, always visible */
  .country-row.selected { background: #F0ECFF; }
  .country-row .flag { font-size: 14px; width: 20px; text-align: center; flex: none; }
  .country-row .names { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 5px; overflow: hidden; }
  .country-row .names .full { font-size: 11px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .country-row .names .code { font-size: 10px; color: var(--text-dim); font-weight: 600; flex: none; }
  /* green signal dot — only when selected AND connected */
  .country-row .signal {
    width: 10px; height: 10px; border-radius: 50%;
    flex: none;
    opacity: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .country-row .signal::after {
    content: ""; width: 5px; height: 5px; border-radius: 50%;
    background: var(--green);
  }
  .country-row.active .signal { opacity: 1; }
  .country-row.active .signal::after {
    animation: signal 1.2s ease-out infinite;
  }
  @keyframes signal {
    0% { box-shadow: 0 0 0 0 rgba(34,197,94,.55); }
    100% { box-shadow: 0 0 0 6px rgba(34,197,94,0); }
  }

  /* ---------- Restore / toast ---------- */
  .restorebar {
    position: fixed; left: 50%; bottom: 26px;
    transform: translateX(-50%) translateY(80px);
    background: #1A1A1A; color: #fff;
    border: 1px solid #2A2A2A;
    border-radius: 24px;
    padding: 8px 14px;
    display: flex; align-items: center; gap: 8px;
    font-size: 12px; font-weight: 600;
    z-index: 50;
    box-shadow: 0 10px 26px rgba(0,0,0,.5);
    transition: transform .3s cubic-bezier(.2,.9,.3,1.1);
    cursor: pointer;
    white-space: nowrap;
  }
  .restorebar.show { transform: translateX(-50%) translateY(0); }
  .restorebar .mini {
    width: 18px; height: 18px; border-radius: 50%;
    background: #000;
    flex: none;
  }

  /* snackbar-style toast (mirrors the app's bottom message overlay) */
  .toast {
    position: fixed; left: 50%; bottom: 26px;
    transform: translateX(-50%) translateY(80px);
    background: #1A1A1A; color: #fff;
    border-radius: 24px;
    padding: 10px 18px;
    font-size: 12px; font-weight: 600;
    z-index: 55;
    box-shadow: 0 10px 26px rgba(0,0,0,.5);
    transition: transform .25s cubic-bezier(.2,.9,.3,1.1);
    white-space: nowrap;
    max-width: 90vw; overflow: hidden; text-overflow: ellipsis;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

  <div class="hintbar">
    <span><b>Tap</b> → connect / disconnect</span>
    <span><b>Hold</b> → quick menu</span>
  </div>

  <!-- bubble -->
  <div class="bubble" id="bubble">
    <svg class="glyph" id="glyphPlay" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
    <div class="timer" id="timer" style="display:none">00:00</div>
    <div class="connecting-spinner" id="spinner" style="display:none"></div>
  </div>

  <!-- flag pill -->
  <div class="flagpill" id="flagPill">🇭🇰 HK</div>

  <!-- long-press menu -->
  <div class="scrim" id="scrim"></div>
  <div class="menu" id="menu">
    <div class="rail">
      <button class="page active" id="countriesBtn" aria-label="Countries" aria-pressed="true">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.54 15H17a2 2 0 0 0-2 2v4.54"/><path d="M7 3.34V5a3 3 0 0 0 3 3a2 2 0 0 1 2 2c0 1.1.9 2 2 2a2 2 0 0 0 2-2c0-1.1.9-2 2-2h3.17"/><path d="M11 21.95V18a2 2 0 0 0-2-2a2 2 0 0 1-2-2v-1a2 2 0 0 0-2-2H2.05"/><circle cx="12" cy="12" r="10"/></svg>
      </button>
      <button class="page" id="profilesBtn" aria-label="Profiles" aria-pressed="false">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      </button>
    </div>
    <div class="main">
      <div class="search" id="searchRow">
        <input id="searchInput" type="text" placeholder="Search country or code…" autocomplete="off" spellcheck="false">
        <button class="clear" id="searchClear" aria-label="Clear search">✕</button>
      </div>
      <div class="profiles" id="profiles"></div>
      <div class="list" id="countries"></div>
    </div>
  </div>

  <!-- restore bar -->
  <div class="restorebar" id="restoreBar">
    <span class="mini"></span>
    Bubble hidden — tap to restore
  </div>

  <!-- snackbar-style message (mirrors BubbleMenuOverlay.showMessage) -->
  <div class="toast" id="toast"></div>

<script>
  (function () {
    const bubble = document.getElementById('bubble');
    const menu = document.getElementById('menu');
    const scrim = document.getElementById('scrim');
    const flagPill = document.getElementById('flagPill');
    const restoreBar = document.getElementById('restoreBar');
    const toast = document.getElementById('toast');
    const countriesEl = document.getElementById('countries');
    const timer = document.getElementById('timer');

    const glyphPlay = document.getElementById('glyphPlay');
    const spinner = document.getElementById('spinner');
    const countriesBtn = document.getElementById('countriesBtn');
    const searchInput = document.getElementById('searchInput');
    const searchClear = document.getElementById('searchClear');
    const profilesBtn = document.getElementById('profilesBtn');
    const profilesEl = document.getElementById('profiles');

    // ---- data (mirrors Utility.getRecentCountries / Countries.ALL) ----
    const FLAGS = { HK: '🇭🇰', US: '🇺🇸', SG: '🇸🇬', JP: '🇯🇵', GB: '🇬🇧', DE: '🇩🇪', NL: '🇳🇱', CA: '🇨🇦', FR: '🇫🇷', AU: '🇦🇺', SE: '🇸🇪', CH: '🇨🇭', KR: '🇰🇷', IN: '🇮🇳', BR: '🇧🇷', MX: '🇲🇽', IT: '🇮🇹', ES: '🇪🇸', PT: '🇵🇹', IE: '🇮🇪', BE: '🇧🇪', AT: '🇦🇹', DK: '🇩🇰', FI: '🇫🇮', NO: '🇳🇴', PL: '🇵🇱', RU: '🇷🇺', TR: '🇹🇷', SA: '🇸🇦', AE: '🇦🇪', IL: '🇮🇱', TH: '🇹🇭', MY: '🇲🇾', ID: '🇮🇩', PH: '🇵🇭', VN: '🇻🇳', TW: '🇹🇼', NZ: '🇳🇿', AR: '🇦🇷', CL: '🇨🇱', CO: '🇨🇴', ZA: '🇿🇦', EG: '🇪🇬', NG: '🇳🇬', KE: '🇰🇪' };
    const NAMES = { HK: 'Hong Kong', US: 'United States', SG: 'Singapore', JP: 'Japan', GB: 'United Kingdom', DE: 'Germany', NL: 'Netherlands', CA: 'Canada', FR: 'France', AU: 'Australia', SE: 'Sweden', CH: 'Switzerland', KR: 'South Korea', IN: 'India', BR: 'Brazil', MX: 'Mexico', IT: 'Italy', ES: 'Spain', PT: 'Portugal', IE: 'Ireland', BE: 'Belgium', AT: 'Austria', DK: 'Denmark', FI: 'Finland', NO: 'Norway', PL: 'Poland', RU: 'Russia', TR: 'Türkiye', SA: 'Saudi Arabia', AE: 'UAE', IL: 'Israel', TH: 'Thailand', MY: 'Malaysia', ID: 'Indonesia', PH: 'Philippines', VN: 'Vietnam', TW: 'Taiwan', NZ: 'New Zealand', AR: 'Argentina', CL: 'Chile', CO: 'Colombia', ZA: 'South Africa', EG: 'Egypt', NG: 'Nigeria', KE: 'Kenya' };
    // last 3 octets are fixed per-country; first octet varies per session
    const IPS = { HK: '103.27.15.33', US: '104.244.72.33', SG: '128.106.81.33', JP: '45.86.104.33', GB: '85.159.224.33', DE: '185.228.42.33', NL: '185.107.66.33', CA: '45.159.200.33', FR: '145.239.10.33', AU: '103.91.178.33', SE: '194.68.48.33', CH: '146.70.60.33', KR: '45.9.32.33', IN: '103.156.21.33', BR: '177.54.144.33', MX: '201.147.7.33', IT: '185.179.60.33', ES: '185.183.57.33', PT: '194.38.71.33', IE: '185.193.113.33', BE: '91.195.18.33', AT: '185.150.116.33', DK: '77.75.106.33', FI: '185.111.232.33', NO: '185.209.4.33', PL: '85.14.222.33', RU: '185.178.200.33', TR: '188.132.200.33', SA: '185.172.21.33', AE: '31.25.134.33', IL: '185.208.158.33', TH: '202.168.73.33', MY: '119.40.90.33', ID: '103.84.57.33', PH: '103.26.137.33', VN: '103.208.102.33', TW: '45.136.244.33', NZ: '103.92.36.33', AR: '181.41.233.33', CL: '190.13.44.33', CO: '186.116.137.33', ZA: '196.43.129.33', EG: '156.53.91.33', NG: '41.203.68.33', KE: '102.133.220.33' };
    // E.164 country calling codes (digits only) — mirrors Countries.kt `phone`
    const PHONES = { HK: '852', US: '1', SG: '65', JP: '81', GB: '44', DE: '49', NL: '31', CA: '1', FR: '33', AU: '61', SE: '46', CH: '41', KR: '82', IN: '91', BR: '55', MX: '52', IT: '39', ES: '34', PT: '351', IE: '353', BE: '32', AT: '43', DK: '45', FI: '358', NO: '47', PL: '48', RU: '7', TR: '90', SA: '966', AE: '971', IL: '972', TH: '66', MY: '60', ID: '62', PH: '63', VN: '84', TW: '886', NZ: '64', AR: '54', CL: '56', CO: '57', ZA: '27', EG: '20', NG: '234', KE: '254' };
    // all selectable countries, alphabetized by name
    const ALL = Object.keys(NAMES);
    // recently-used countries — always shown at the top of the list
    let RECENT = ['US', 'HK', 'SG', 'JP', 'TR', 'DE', 'GB'];
    let usedAll = new Set(RECENT);

    // ---- profiles (mirrors ProfileManager + ProxyProviders) ----
    // type: owl | rapid | clip | generic | custom  (custom = no country switching)
    // cc: the country zone embedded in this profile's username (custom → none).
    const PROFILES = [
      { name: 'Default',      type: 'custom',  cc: '',     server: '127.0.0.1:1080',   ip: '' },
      { name: 'HK Owl',       type: 'owl',     cc: 'HK',   server: 'owl.hk.owlproxy.com:443', ip: '103.27.15.33' },
      { name: 'JP Rapid',     type: 'rapid',   cc: 'JP',   server: 'jp.residential.rapidproxy.io:443', ip: '45.86.104.33' },
      { name: 'US Clip',      type: 'clip',    cc: 'US',   server: 'us.region.cliproxy.io:443', ip: '104.244.72.33' },
      { name: 'SG Generic',   type: 'generic', cc: 'SG',   server: '128.106.81.33:443', ip: '128.106.81.33' },
    ];
    let activeProfile = 0;   // index into PROFILES

    const PROVIDER_LABEL = { owl: 'OwlProxy', rapid: 'RapidProxy', clip: 'ClipProxy', generic: 'Generic', custom: 'Custom' };
    const PROVIDER_ICON = { owl: '🦉', rapid: '⚡', clip: '✂️', generic: '🌐', custom: '📡' };
    const supportsCountrySwitch = p => p.type !== 'custom';
    // The zone shown on the pill / selected in the list = the active profile's zone.
    const currentZone = () => PROFILES[activeProfile].cc;

    // ---- state ----
    let mode = 'idle';           // idle | connecting | connected
    let elapsed = 452;          // seconds
    let menuOpen = false;
    let bubbleHidden = false;
    let pressed = false, lpFired = false, moved = false;
    let lpTimer = null, timerTick = null;
    let searchQuery = '';

    const MARGIN = 10;
    const BUBBLE = 60;

    // ---- rendering helpers ----
    function setMode(m) {
      mode = m;
      bubble.classList.toggle('connected', m === 'connected');
      bubble.classList.toggle('connecting', m === 'connecting');
      glyphPlay.style.display = m === 'idle' ? '' : 'none';
      spinner.style.display = m === 'connecting' ? '' : 'none';
      timer.style.display = m === 'connected' ? '' : 'none';
      if (m === 'connected') startTimer(); else stopTimer();
      updatePill();
      renderCountries();
    }

    function startTimer() {
      stopTimer();
      timerTick = setInterval(() => { elapsed++; updateTimerText(); }, 1000);
    }
    function stopTimer() { if (timerTick) clearInterval(timerTick); timerTick = null; }
    function fmt(s) { const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), ss = s % 60; return h > 0 ? `${h}:${String(m).padStart(2,'0')}:${String(ss).padStart(2,'0')}` : `${String(m).padStart(2,'0')}:${String(ss).padStart(2,'0')}`; }
    function updateTimerText() { if (mode === 'connected') { timer.textContent = fmt(elapsed); } }

    function updatePill() {
      if (mode === 'connected') {
        const cc = currentZone();
        if (!cc) { flagPill.classList.remove('show'); return; }
        const octet = IPS[cc].split('.').pop();
        flagPill.textContent = `${FLAGS[cc]} ${cc} ${octet}`;
        flagPill.classList.add('show');
      } else {
        flagPill.classList.remove('show');
      }
    }

    // ---- countries list ----
    function makeRow(code) {
      const chosen = code === currentZone();
      const active = chosen && mode === 'connected';
      const row = document.createElement('div');
      row.className = 'country-row' + (chosen ? ' selected' : '') + (active ? ' active' : '');
      row.setAttribute('role', 'option');
      row.setAttribute('aria-selected', String(chosen));
      row.setAttribute('tabindex', '0');
      row.innerHTML = `
        <span class="flag">${FLAGS[code]}</span>
        <div class="names">
          <div class="full">${NAMES[code]}</div>
          <div class="code">${code}</div>
        </div>
        <span class="signal"></span>`;
      row.addEventListener('click', e => {
        e.stopPropagation();
        if (!supportsCountrySwitch(PROFILES[activeProfile])) {
          showToast('Country switching is not available for this profile');
          return;
        }
        selectCountry(code);
      });
      row.addEventListener('keydown', e => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault(); e.stopPropagation();
          if (!supportsCountrySwitch(PROFILES[activeProfile])) {
            showToast('Country switching is not available for this profile');
            return;
          }
          selectCountry(code);
        }
      });
      return row;
    }

    function sectionLabel(text) {
      const d = document.createElement('div');
      d.className = 'seclabel';
      d.textContent = text;
      return d;
    }

    let toastTimer = null;
    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 2600);
    }

    function matchesQuery(c) {
      if (!searchQuery) return true;
      if (NAMES[c].toLowerCase().includes(searchQuery) ||
          c.toLowerCase().includes(searchQuery) ||
          String(FLAGS[c]).toLowerCase().includes(searchQuery)) return true;
      // search by country calling number, e.g. +880 / 88017 / 8801752xxx
      const digits = searchQuery.replace(/\D/g, '');
      if (!digits) return false;
      const phone = String(PHONES[c] || '');
      return phone.startsWith(digits) || digits.startsWith(phone);
    }

    function renderCountries() {
      countriesEl.innerHTML = '';

      const recent = [...RECENT].filter(matchesQuery);
      const others = ALL.filter(c => !RECENT.includes(c) && matchesQuery(c))
                        .sort((a, b) => NAMES[a].localeCompare(NAMES[b]));

      if (recent.length) {
        countriesEl.appendChild(sectionLabel('Recent'));
        recent.forEach(c => countriesEl.appendChild(makeRow(c)));
      }
      if (recent.length && others.length) {
        const sep = document.createElement('div');
        sep.className = 'sep';
        countriesEl.appendChild(sep);
      }
      if (others.length) {
        countriesEl.appendChild(sectionLabel('All'));
        others.forEach(c => countriesEl.appendChild(makeRow(c)));
      }
      if (!recent.length && !others.length) {
        const empty = document.createElement('div');
        empty.className = 'seclabel';
        empty.textContent = 'No countries match "' + searchQuery + '"';
        countriesEl.appendChild(empty);
      }
    }

    // ---- search (always visible) ----
    searchInput.addEventListener('input', () => {
      searchQuery = searchInput.value.trim().toLowerCase();
      if (page === 'profiles') renderProfiles(); else renderCountries();
    });
    searchClear.addEventListener('click', e => {
      e.stopPropagation();
      searchInput.value = '';
      searchQuery = '';
      if (page === 'profiles') renderProfiles(); else renderCountries();
      searchInput.focus();
    });

    // ---- profiles ----
    function matchesProfile(p) {
      if (!searchQuery) return true;
      return p.name.toLowerCase().includes(searchQuery) ||
             PROVIDER_LABEL[p.type].toLowerCase().includes(searchQuery) ||
             p.server.toLowerCase().includes(searchQuery);
    }

    function renderProfiles() {
      profilesEl.innerHTML = '';
      PROFILES.filter(matchesProfile).forEach((p, i) => {
        const idx = PROFILES.indexOf(p);
        const row = document.createElement('div');
        const chosen = idx === activeProfile;
        row.className = 'profile-row' + (chosen ? ' selected' : '');
        row.setAttribute('role', 'option');
        row.setAttribute('aria-selected', String(chosen));
        row.setAttribute('tabindex', '0');
        row.innerHTML = `
          <span class="picon">${PROVIDER_ICON[p.type]}</span>
          <div class="pnames">
            <div class="full">${p.name}</div>
            <div class="sub">${PROVIDER_LABEL[p.type]}</div>
          </div>
          <span class="check"></span>`;
        row.addEventListener('click', e => { e.stopPropagation(); selectProfile(idx); });
        row.addEventListener('keydown', e => {
          if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); e.stopPropagation(); selectProfile(idx); }
        });
        profilesEl.appendChild(row);
      });
      if (profilesEl.children.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'seclabel';
        empty.textContent = 'No profiles match "' + searchQuery + '"';
        profilesEl.appendChild(empty);
      }
    }

    function selectProfile(i) {
      if (i === activeProfile) { closeMenu(); return; }
      activeProfile = i;
      renderProfiles();
      // Country lives inside the profile's username: switching profiles switches
      // the zone too. Custom profiles have no zone.
      setMode('connecting');
      setTimeout(() => setMode('connected'), 900);
      closeMenu();
    }

    // ---- rail page switching ----
    let page = 'countries';   // countries | profiles
    function setPage(next) {
      if (next === page) return;
      page = next;
      countriesBtn.classList.toggle('active', next === 'countries');
      profilesBtn.classList.toggle('active', next === 'profiles');
      countriesBtn.setAttribute('aria-pressed', String(next === 'countries'));
      profilesBtn.setAttribute('aria-pressed', String(next === 'profiles'));
      if (next === 'profiles') {
        countriesEl.style.display = 'none';
        profilesEl.classList.add('show');
        // Reset any search when entering the Profiles page
        searchQuery = '';
        searchInput.value = '';
        searchInput.placeholder = 'Search profiles…';
        renderProfiles();
      } else {
        profilesEl.classList.remove('show');
        countriesEl.style.display = '';
        // Reset any search when entering the Countries page
        searchQuery = '';
        searchInput.value = '';
        searchInput.placeholder = 'Search country or code…';
        renderCountries();
      }
    }
    countriesBtn.addEventListener('click', e => { e.stopPropagation(); setPage('countries'); });
    profilesBtn.addEventListener('click', e => { e.stopPropagation(); setPage('profiles'); });

    function selectCountry(code) {
      PROFILES[activeProfile].cc = code;   // rewrite the profile's username zone
      // move chosen country to front of the recent list
      RECENT = [code, ...RECENT.filter(c => c !== code)];
      usedAll.add(code);
      // connect regardless of current state (idle → connect, connected → switch)
      setMode('connecting');
      setTimeout(() => setMode('connected'), 900);
      closeMenu();
    }

    // ---- menu open/close + anchoring ----
    function openMenu() {
      if (bubbleHidden) return;
      menuOpen = true;
      if (page === 'profiles') setPage('countries');
      positionMenu();
      scrim.classList.add('show');
      menu.classList.add('show');
    }
    function closeMenu() {
      menuOpen = false;
      scrim.classList.remove('show');
      menu.classList.remove('show');
    }

    function positionMenu() {
      const br = bubble.getBoundingClientRect();
      const bx = br.left, by = br.top;
      const mw = menu.offsetWidth || 260;
      const mh = menu.offsetHeight || 380;
      const vw = window.innerWidth;
      const vh = window.innerHeight;

      const pad = 8;
      // Available free space on each side of the bubble
      const right  = vw - (bx + BUBBLE) - MARGIN;
      const left   = bx - MARGIN;
      const bottom = vh - (by + BUBBLE) - MARGIN;
      const top    = by - MARGIN;

      // Horizontal sides host the menu by its width, vertical sides by its height.
      const fitsH = s => s >= mw;
      const fitsV = s => s >= mh;

      let side;
      // 1) Prefer horizontal (left/right) whenever either fits
      const h = [['right', right], ['left', left]].filter(([, s]) => fitsH(s));
      if (h.length) {
        side = h.sort((a, b) => b[1] - a[1])[0][0];
      } else {
        // 2) Fall back to vertical (bottom/top)
        const v = [['bottom', bottom], ['top', top]].filter(([, s]) => fitsV(s));
        if (v.length) {
          side = v.sort((a, b) => b[1] - a[1])[0][0];
        } else {
          // 3) Nothing fits cleanly — use the largest free space
          side = [['right', right], ['left', left], ['bottom', bottom], ['top', top]]
            .sort((a, b) => b[1] - a[1])[0][0];
        }
      }

      let x, y;
      switch (side) {
        case 'right':
          x = bx + BUBBLE + MARGIN;
          y = by + BUBBLE / 2 - mh / 2;
          break;
        case 'left':
          x = bx - mw - MARGIN;
          y = by + BUBBLE / 2 - mh / 2;
          break;
        case 'bottom':
          x = bx + BUBBLE / 2 - mw / 2;
          y = by + BUBBLE + MARGIN;
          break;
        case 'top':
        default:
          x = bx + BUBBLE / 2 - mw / 2;
          y = by - mh - MARGIN;
          break;
      }

      x = Math.min(Math.max(pad, x), vw - mw - pad);
      y = Math.min(Math.max(pad, y), vh - mh - pad);
      menu.style.left = x + 'px';
      menu.style.top = y + 'px';

      // Animation grows from the bubble-facing edge
      menu.style.transformOrigin =
        side === 'right' ? 'left center' :
        side === 'left' ? 'right center' :
        side === 'bottom' ? 'center top' : 'center bottom';
    }

    // ---- bubble interactions ----
    let startX = 0, startY = 0;
    const SLOP = 6;

    bubble.addEventListener('pointerdown', e => {
      if (bubbleHidden) return;
      e.preventDefault();
      pressed = true;
      startX = e.clientX; startY = e.clientY;
      moved = false; lpFired = false;
      bubble.setPointerCapture(e.pointerId);
      bubble.classList.add('pressed');
      if (menuOpen) { closeMenu(); return; }
      lpTimer = setTimeout(() => {
        lpFired = true;
        bubble.classList.remove('pressed');
        openMenu();
      }, 480);
    });

    bubble.addEventListener('pointermove', e => {
      if (!pressed || bubbleHidden) return;
      const dx = e.clientX - startX, dy = e.clientY - startY;
      if (!moved && Math.hypot(dx, dy) > SLOP) {
        moved = true;
        if (lpTimer) { clearTimeout(lpTimer); lpTimer = null; }
      }
      if (!moved) return;
      bubble.classList.add('dragging');
      bubble.classList.remove('pressed');
      let nx = bubble.offsetLeft + dx;
      let ny = bubble.offsetTop + dy;
      const pad = 8;
      nx = Math.min(Math.max(pad, nx), window.innerWidth - BUBBLE - pad);
      ny = Math.min(Math.max(pad, ny), window.innerHeight - BUBBLE - pad);
      bubble.style.left = nx + 'px';
      bubble.style.top = ny + 'px';
      startX = e.clientX; startY = e.clientY;
      const cx = nx + BUBBLE / 2;
      flagPill.style.left = cx + 'px';
      flagPill.style.top = ny + BUBBLE - 3 + 'px';
      if (menuOpen) positionMenu();
    });

    bubble.addEventListener('pointerup', e => {
      if (!pressed) return;
      pressed = false;
      bubble.classList.remove('pressed', 'dragging');
      if (lpTimer) { clearTimeout(lpTimer); lpTimer = null; }
      if (lpFired) { lpFired = false; return; }
      if (!moved && !menuOpen) {
        if (mode === 'connected') {
          setMode('idle');
        } else {
          setMode('connecting');
          setTimeout(() => setMode('connected'), 900);
        }
      }
      moved = false;
    });

    bubble.addEventListener('pointercancel', () => {
      pressed = false;
      bubble.classList.remove('pressed', 'dragging');
      if (lpTimer) { clearTimeout(lpTimer); lpTimer = null; }
      moved = false;
    });

    // ---- scrim ----
    scrim.addEventListener('click', closeMenu);

    // ---- init ----
    function initPillPos() {
      const cx = bubble.offsetLeft + BUBBLE / 2;
      flagPill.style.left = cx + 'px';
      flagPill.style.top = bubble.offsetTop + BUBBLE - 3 + 'px';
    }
    renderCountries();
    renderProfiles();
    searchInput.placeholder = 'Search country or code…';
    setMode('idle');
    initPillPos();
    window.addEventListener('resize', () => { if (menuOpen) positionMenu(); });
  })();
</script>
</body>
</html>
